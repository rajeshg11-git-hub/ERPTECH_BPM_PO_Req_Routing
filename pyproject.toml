[project]
name = "po-approval-agent"
version = "0.1.0"
description = "Python FastAPI Agent for Dynamic Purchase Order and Requisition Approvals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "google-cloud-firestore>=2.14.0",
    "firebase-admin>=6.5.0",
    "google-genai>=0.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "matplotlib>=3.8.0",
    "pillow>=10.2.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

